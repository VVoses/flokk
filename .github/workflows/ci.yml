name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: format check
        run: npx prettier --check "js/*.js" "css/*.css" "tools/*.{cjs,mjs}" index.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-ci.txt

      - name: cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: install Chromium system dependencies
        run: python3 -m playwright install-deps chromium

      - name: install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python3 -m playwright install chromium

      - name: syntax check + headless smoke
        run: npm run check

      - name: saved flight coordination
        run: python3 tools/session_check.py

      - name: farms meet the road cleanly
        run: python3 tools/road_check.py

      - name: glacial stream clears land use and crosses on bridges
        run: python3 tools/stream_check.py

      - name: seeded visual smoke
        run: python3 tools/visual_smoke.py

      - name: full flow (title, play, pause, game over, full year, resize, night, phone)
        run: python3 tools/flows.py

      - name: keyboard, modal and narrow-screen menu accessibility
        run: python3 tools/menu_check.py

      - name: loading feedback and touch HUD
        run: python3 tools/loading_hud_check.py

      - name: continuous water and gust foam
        run: python3 tools/water_check.py
      - name: roadside power poles and sparse railway masts
        run: python3 tools/pole_check.py

      - name: bounded water and audible seasonal music
        run: python3 tools/basin_music_check.py

      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: |
            tools/out/*.png
            tools/out/visual-smoke/*.png
            tools/out/menu-ux/*.png
            tools/out/loading-hud/*.png
            tools/out/water/*.png
            tools/out/basin-music/*
          if-no-files-found: ignore

  # How each element of the land animates through every season change and every dawn and dusk (DESIGN.md pillar 3:
  # things emerge, they don't switch). Reports the steps that pop; non-blocking until it is decided it should be.
  transitions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-ci.txt -r requirements-matrix.txt

      - name: cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}

      - name: install Chromium system dependencies
        run: python3 -m playwright install-deps chromium

      - name: install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python3 -m playwright install chromium

      - name: transition matrix (quick)
        run: python3 tools/transitions.py --quick

      - name: upload sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-matrix
          path: tools/out/transitions/*
          if-no-files-found: ignore
