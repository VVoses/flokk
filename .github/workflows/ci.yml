name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: format check
        run: npx prettier --check "js/*.js" "css/*.css" index.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install playwright

      - run: python3 -m playwright install --with-deps chromium

      - name: syntax check + headless smoke
        run: npm run check

      - name: full flow (title, play, pause, game over, full year, resize, night, phone)
        run: python3 tools/flows.py

      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: tools/out/*.png
          if-no-files-found: ignore
